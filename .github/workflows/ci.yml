name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -switch "$LATEST_XCODE"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Diagnose available simulators
        run: |
          echo "--- Installed Xcode versions ---"
          ls /Applications | grep Xcode
          echo "--- Available runtimes ---"
          xcrun simctl list runtimes available
          echo "--- Available iOS devices ---"
          xcrun simctl list devices available

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project EnjoeiProducts.xcodeproj -scheme EnjoeiProducts

      - name: Run tests
        run: |
          xcodebuild test \
            -project EnjoeiProducts.xcodeproj \
            -scheme EnjoeiProducts \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation
